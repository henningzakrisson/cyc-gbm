data:
  data_source: simulation
  distribution: gamma
  parameterization: mean-dispersion
  random_seed: 11
  n_samples: 100000
  n_features: 6
  test_size: 0.2
  normalize_features: true
  parameter_function: |
    def parameter(X):
        z0 = (0.05 * X[:,0]
              + 0.03 * X[:,1]
              + 0.04 * X[:,2])
        z1 = (0.4 * X[:,0]
              + np.minimum(0.2 * X[:,1]**2, 1.0)
              + 0.3 * np.abs(X[:,2]) * np.sin(1.5 * X[:,2])
              + np.clip(0.15 * X[:,3] * X[:,4], -1.0, 1.0)
              + np.clip(0.1 * X[:,4]**2 * X[:,5], -1.0, 1.0))
        return np.stack([z0, z1])

output:
  output_dir: data/results

models:
  - model_class: intercept
    name: intercept_md
    parameterization: mean-dispersion
  - model_class: cglm
    name: cglm_md
    parameterization: mean-dispersion
    max_iter: 2000
    tolerance: 1e-5
    step_size: 0.1
  - model_class: gbm
    name: gbm_md
    parameterization: mean-dispersion
    n_estimators: 600
    max_depth: 4
    learning_rate: 0.05
  - model_class: cgbm
    name: cgbm_md
    parameterization: mean-dispersion
    n_estimators: [500, 500]
    max_depth: 4
    learning_rate: [0.05, 0.01]

bootstrap:
  n_bootstraps: 100
  parallel: true
  n_jobs: -1

tuning:
  perform_tuning: true
  n_folds: 2
