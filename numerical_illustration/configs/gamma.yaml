data:
  data_source: simulation
  distribution: gamma
  parameterization: shape-rate
  random_seed: 11
  n_samples: 100000
  n_features: 6
  test_size: 0.2
  normalize_features: true
  parameter_function: |
    def parameter(X):
        # log(alpha): complex interactions, clipped to [-3, 3] to prevent extreme shape values
        # a1=0.4, a2=0.2, a3=0.3, a4=1.5, a5=0.15, a6=0.1
        z0 = (0.4 * X[:,0]
              + 0.2 * X[:,1]**2
              + 0.3 * np.abs(X[:,2]) * np.sin(1.5 * X[:,2])
              + 0.15 * X[:,3] * X[:,4]
              + 0.1 * X[:,4]**2 * X[:,5])
        z0 = np.clip(z0, -3, 3)
        # log(beta): clipped to [-2, 1] so rate stays in (exp(-2), e) ~ (0.14, 2.7)
        # b0=-0.5, b1=0.3, b2=0.3
        z1 = (-0.5
              + 0.3 * X[:,1]
              + 0.3 * np.abs(X[:,0]))
        z1 = np.clip(z1, -2, 1)
        return np.stack([z0, z1])

output:
  output_dir: data/results

models:
  # Shape-rate models
  - model_class: intercept
    name: intercept_sr
  - model_class: cglm
    name: cglm_sr
    max_iter: 2000
    tolerance: 1e-5
    step_size: 0.1
  - model_class: gbm
    name: gbm_sr
    n_estimators: 600
    max_depth: 4
    learning_rate: 0.05
  - model_class: cgbm
    name: cgbm_sr
    n_estimators: [500, 500]
    max_depth: 4
    learning_rate: [0.05, 0.01]
  # Mean-dispersion models
  - model_class: intercept
    name: intercept_md
    parameterization: mean-dispersion
  - model_class: cglm
    name: cglm_md
    parameterization: mean-dispersion
    max_iter: 2000
    tolerance: 1e-5
    step_size: 0.1
  - model_class: gbm
    name: gbm_md
    parameterization: mean-dispersion
    n_estimators: 600
    max_depth: 4
    learning_rate: 0.05
  - model_class: cgbm
    name: cgbm_md
    parameterization: mean-dispersion
    n_estimators: [500, 500]
    max_depth: 4
    learning_rate: [0.05, 0.01]

bootstrap:
  n_bootstraps: 100
  parallel: true
  n_jobs: -1

tuning:
  perform_tuning: true
  n_folds: 2
